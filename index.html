<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hangout</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111'/%3E%3Crect x='10' y='6' width='10' height='52' fill='%23fff'/%3E%3Crect x='44' y='6' width='10' height='52' fill='%23fff'/%3E%3Crect x='10' y='26' width='44' height='9' fill='%23fff'/%3E%3C/svg%3E">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Hangout">
  <meta property="og:description" content="Measure your hang time with reaction-delay correction.">
  <meta property="og:url" content="https://imraansafla.github.io/hangout-timer/">
  <meta property="og:image" content="https://imraansafla.github.io/hangout-timer/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hangout">
  <meta name="twitter:description" content="Measure your hang time with reaction-delay correction.">
  <meta name="twitter:image" content="https://imraansafla.github.io/hangout-timer/og-image.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
    button, input { font-family: inherit; }

    :root {
      --c-text:    #111111;
      --c-dim:     #666666;
      --c-muted:   #999999;
      --c-divider: rgba(0,0,0,0.07);
      --c-accent:  #74B3CE;

      --g-black:   linear-gradient(180deg, #2a2a2a 0%, #000000 100%);
      --g-white:   linear-gradient(180deg, #ffffff 0%, #f0f0f4 100%);

      --shadow-sm: 0 2px 10px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 6px 28px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-blk: 0 8px 32px rgba(0,0,0,0.26), inset 0 1px 0 rgba(255,255,255,0.10);
      --inset-hi:  inset 0 1px 0 rgba(255,255,255,0.95);

      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      background: radial-gradient(ellipse at 50% -5%, #ffffff 0%, #ecedf2 65%);
      color: var(--c-text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      height: 100%;
    }
    .screen.active { display: flex; }

    /* Glass card — light version */
    .glass-card {
      background: linear-gradient(180deg, #ffffff 0%, #f7f7fa 100%);
      border: 1px solid rgba(0,0,0,0.07);
      box-shadow: var(--shadow-md), var(--inset-hi);
    }

    /* Label chip */
    .tag {
      display: inline-block;
      background: rgba(0,0,0,0.055);
      color: var(--c-dim);
      padding: 5px 15px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* ─── READY ──────────────────────────────────────── */
    #screen-ready {
      align-items: center;
      justify-content: space-between;
      padding: 48px 28px max(32px, var(--safe-b));
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    #screen-ready > * { flex-shrink: 0; }

    .ready-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .ready-top h1 {
      font-size: 58px;
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      color: var(--c-text);
    }

    .ready-top p {
      font-size: 12px;
      color: var(--c-dim);
      line-height: 1.2;
    }

    .ready-bottom {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Artwork size comes from the screen height (not from the content), so she fills
       the gap between the subline and the Start row, and saved sets never shrink her:
       the screen scrolls instead. svh = height with Safari's toolbars showing, so she
       doesn't resize while scrolling. ~352px is everything else, including the 16px breathing room either side on the screen; /0.91
       because the negative margins below trim the artwork's empty transparent edges. */
    .ready-bg {
      --fig-h: clamp(280px, calc((100vh - 352px) / 0.91), min(600px, calc((100vw - 16px) * 1.5)));
      flex: 1 0 auto;
      width: 100%;
      padding: 16px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }
    @supports (height: 100svh) {
      .ready-bg { --fig-h: clamp(280px, calc((100svh - 352px) / 0.91), min(600px, calc((100vw - 16px) * 1.5))); }
    }
    .ready-bg img, #hanger {
      height: var(--fig-h);
      width: calc(var(--fig-h) * 426 / 640);
      max-width: none;
      margin: calc(var(--fig-h) * -0.05) 0 calc(var(--fig-h) * -0.04);
      /* Her body's visual centre sits ~22 design px left of the artwork's centre (the bar
         reaches further left than right), so nudge her right to sit centred on screen. */
      transform: translateX(calc(var(--fig-h) * 22 / 640));
    }
    .ready-bg img {
      display: block;
      opacity: 0.92;
    }
    /* Interactive version of the artwork (WebGL). The <img> stays as the fallback. */
    #hanger {
      display: none;
      opacity: 0.92;
      pointer-events: auto;
      touch-action: pan-y;
      -webkit-touch-callout: none;
      cursor: pointer;
    }
    .ready-bg.live img { display: none; }
    .ready-bg.live #hanger { display: block; }

    .ready-top, .ready-bottom {
      position: relative;
      z-index: 1;
    }

    .start-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    /* Tappable countdown box */
    #countdown-pill {
      flex: 0 0 auto;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--g-white);
      border: 1px solid rgba(0,0,0,0.08);
      color: var(--c-text);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      box-shadow: var(--shadow-sm), var(--inset-hi);
      transition: opacity 0.12s, transform 0.1s;
      user-select: none;
      -webkit-user-select: none;
    }
    #countdown-pill:active { opacity: 0.65; transform: scale(0.97); }

    #btn-start {
      flex: 1;
      min-width: 0;
      height: 72px;
      border: none;
      background: var(--g-black);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: var(--shadow-blk);
      transition: opacity 0.15s, transform 0.1s;
    }
    #btn-start:active { opacity: 0.82; transform: scale(0.98); }

    /* ─── COUNTDOWN ──────────────────────────────────── */
    #screen-countdown {
      position: relative;
      align-items: center;
      justify-content: flex-end;
      padding: 40px 28px max(28px, var(--safe-b));
    }

    .countdown-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      pointer-events: none;
    }

    .count-box {
      --box-w: min(66vw, 300px, 46vh);
      position: relative;
      width: var(--box-w);
      height: calc(var(--box-w) * 0.94);
      background: linear-gradient(180deg, #1f1f1f 0%, #000000 100%);
      box-shadow: 0 18px 48px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .count-num {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: calc(var(--box-w) * 0.44);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      will-change: transform;
    }

    /* Subtle hand-over: the old number fades and shrinks a touch,
       the new one fades in while growing into place. */
    @keyframes numIn  { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    @keyframes numOut { from { opacity: 1; transform: scale(1); }    to { opacity: 0; transform: scale(0.95); } }
    .count-num.in  { animation: numIn  0.38s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both; }
    .count-num.out { animation: numOut 0.16s cubic-bezier(0.4, 0, 1, 1) both; }
    @media (prefers-reduced-motion: reduce) {
      .count-num.in, .count-num.out { animation: none; }
    }

    #screen-countdown .btn-ghost { position: relative; z-index: 1; }

    /* ─── HANG ───────────────────────────────────────── */
    #screen-hang {
      flex-direction: column;
      padding: 20px;
      gap: 14px;
    }

    .hang-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 24px 32px;
      gap: 14px;
    }

    #hang-display {
      font-size: clamp(68px, 22vw, 100px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--c-text);
    }
    @keyframes msFlash {
      0%   { color: var(--c-text); }
      12%  { color: var(--c-accent); }
      75%  { color: var(--c-accent); }
      100% { color: var(--c-text); }
    }
    #hang-display.flash { animation: msFlash 2.6s ease both; }

    #btn-stop {
      position: relative;
      overflow: hidden;
      flex: 1;
      background: var(--g-black);
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      padding: 20px 24px var(--safe-b);
      box-shadow: 0 10px 34px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.08);
      transition: transform 0.08s, opacity 0.12s;
    }
    #btn-stop:active {
      opacity: 0.88;
      transform: scale(0.992);
    }

    #ms-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .stop-label, .stop-sub {
      position: relative;
      z-index: 1;
      transition: opacity 0.35s ease;
    }
    #btn-stop.celebrating .stop-label,
    #btn-stop.celebrating .stop-sub { opacity: 0.1; }

    .stop-label {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
    }

    .stop-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.02em;
      text-align: center;
      max-width: 260px;
      line-height: 1.4;
    }

    /* ─── RESULT ──────────────────────────────────────── */
    #screen-result {
      flex-direction: column;
    }

    .result-content {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .result-content > * { flex-shrink: 0; }

    .result-footer {
      padding: 12px 20px max(24px, var(--safe-b));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-header {
      display: flex;
      justify-content: center;
      margin-bottom: 4px;
    }

    .times-card {
      padding: 4px 0 0;
      overflow: hidden;
    }

    .time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 20px;
      border-bottom: 1px solid var(--c-divider);
    }
    .time-row:nth-last-child(2) { border-bottom: none; padding-bottom: 12px; }

    .t-label {
      font-size: 12px;
      color: var(--c-dim);
    }

    .t-val {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .t-val.raw   { color: var(--c-text); }
    .t-val.react { color: var(--c-dim); }

    /* Adjusted row is the focus: full-bleed black band */
    .time-row.adj-row {
      background: var(--g-black);
      padding: 30px 20px;
      border-bottom: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .adj-row .t-label {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
    }
    .t-val.adj {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #fff;
    }

    .reaction-card {
      padding: 18px 20px;
    }

    .r-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--c-muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .r-desc {
      font-size: 12px;
      color: var(--c-muted);
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-btn {
      flex: 0 0 auto;
      width: 62px;
      height: 62px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(0,0,0,0.03);
      color: var(--c-dim);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, opacity 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .step-btn:active { opacity: 0.6; background: rgba(0,0,0,0.07); }

    .reaction-input-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    #reaction-input {
      width: 100%;
      height: 62px;
      background: rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.08);
      padding: 0 16px;
      font-size: 26px;
      font-weight: 700;
      color: var(--c-text);
      letter-spacing: -0.02em;
      text-align: center;
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.15s, background 0.15s;
    }
    #reaction-input:focus {
      border-color: rgba(0,0,0,0.45);
      background: rgba(0,0,0,0.02);
    }

    .reaction-unit {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(0, -50%);
      font-size: 16px;
      font-weight: 700;
      color: var(--c-muted);
      pointer-events: none;
      white-space: nowrap;
    }

    .reaction-measure {
      position: absolute;
      visibility: hidden;
      white-space: pre;
      top: -9999px;
      left: -9999px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #reaction-input::placeholder { color: var(--c-muted); }

    .hand-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--c-muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 16px 0 8px;
    }

    .hand-toggle-row {
      display: flex;
      gap: 10px;
    }

    .hand-toggle {
      flex: 1;
      padding: 12px;
      border: 1.5px solid rgba(0,0,0,0.08);
      background: rgba(0,0,0,0.03);
      color: var(--c-muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
    }
    .hand-toggle:not(.active) { opacity: 0.55; }
    .hand-toggle.active {
      background: var(--g-black);
      border-color: #000;
      color: #fff;
    }

    .btn-primary {
      width: 100%;
      padding: 20px;
      border: none;
      background: var(--g-black);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.1);
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-primary:active { opacity: 0.82; transform: scale(0.98); }
    .btn-primary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-primary:disabled:active { opacity: 0.35; transform: none; }

    .btn-ghost {
      width: 100%;
      padding: 18px;
      border: 1px solid rgba(0,0,0,0.08);
      background: var(--g-white);
      color: var(--c-dim);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm), var(--inset-hi);
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-ghost:active { opacity: 0.65; transform: scale(0.98); }

    /* History */
    .history-section { display: none; }
    .history-section.visible { display: block; }
    #history-section-ready.visible { margin-top: 20px; }

    .history-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--c-muted);
      margin-bottom: 10px;
    }

    .history-swipe {
      position: relative;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .history-delete-bg {
      position: absolute;
      inset: 0;
      background: #3f3f46;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .delete-icon-btn {
      width: 76px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .delete-icon-btn:active { opacity: 0.6; }
    .delete-icon-btn svg { width: 20px; height: 20px; }

    .history-item {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: linear-gradient(180deg, #ffffff 0%, #f7f7fa 100%);
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: var(--shadow-sm), var(--inset-hi);
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .h-num   { font-size: 12px; color: var(--c-muted); }
    .h-time-group { display: flex; align-items: baseline; gap: 6px; }
    .h-adj   { font-size: 20px; font-weight: 800; color: var(--c-text); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .h-raw   { font-size: 12px; color: var(--c-muted); text-align: right; }
    .h-tag   { font-size: 12px; font-weight: 800; letter-spacing: 0.02em; color: var(--c-muted); }

    .support-row {
      display: flex;
      justify-content: center;
      margin-top: 30px;
    }

    .support-btn {
      display: inline-block;
      padding: 8px 16px;
      border: 1px solid rgba(0,0,0,0.12);
      background: transparent;
      color: var(--c-dim);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .support-btn:active { opacity: 0.7; }
    @media (hover: hover) and (pointer: fine) {
      .support-btn:hover {
        border-color: rgba(0,0,0,0.5);
        color: var(--c-text);
        background: rgba(0,0,0,0.03);
      }
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body>
<div id="app">

  <!-- ─── READY ───────────────────────────────────────── -->
  <div id="screen-ready" class="screen active">
    <div class="ready-top">
      <h1>Hangout</h1>

<script>
  const COUNTDOWN_OPTIONS = [10, 5];
  let countdownIdx = 0;
  let startTs      = 0;
  let audioCtx     = null;

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  // Called on the Start tap: resumes the context and plays a silent buffer so iOS unlocks audio
  function unlockAudio() {
    try {
      const ctx = getAudioCtx();
      if (ctx.state === 'suspended') ctx.resume();
      const src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, 22050);
      src.connect(ctx.destination);
      src.start(0);
    } catch(e) {}
  }

  // One beep at an exact audio-clock time
  function beepAt(bus, when, freq, dur) {
    const ctx  = bus.context;
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(bus);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.linearRampToValueAtTime(0.4, when + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, when + dur);
    osc.start(when);
    osc.stop(when + dur + 0.02);
  }

  // Beeps on 3, 2, 1 and a higher "go" beep at 0, the moment the hang timer starts.
  // All are scheduled up front on the audio clock, measured from the same start
  // moment as the display, so they can't drift from the numbers.
  let cdBus = null;
  function scheduleCountdownBeeps(total, t0) {
    try {
      const ctx = getAudioCtx();
      const bus = ctx.createGain();
      bus.connect(ctx.destination);
      cdBus = bus;
      const plan = () => {
        if (cdBus !== bus) return;                          // cancelled while resuming
        const latency = ctx.outputLatency || ctx.baseLatency || 0;
        const base = ctx.currentTime - (performance.now() - t0) / 1000 - latency;
        [[3, 880, 0.12], [2, 880, 0.12], [1, 880, 0.12], [0, 1320, 0.32]].forEach(([n, freq, dur]) => {
          if (n >= total) return;
          const when = base + (total - n);
          if (when >= ctx.currentTime - 0.02) beepAt(bus, Math.max(when, ctx.currentTime), freq, dur);
        });
      };
      if (ctx.state === 'running') plan();
      else ctx.resume().then(plan).catch(() => {});
    } catch(e) {}
  }

  function cancelCountdownBeeps() {
    if (cdBus) { try { cdBus.disconnect(); } catch(e) {} }
    cdBus = null;
  }

  let rawMs      = 0;
  let countTimer = null;
  let hangRAF    = null;
  let handState  = { left: true, right: true };
  const history  = [];

  function getCountdownSecs() { return COUNTDOWN_OPTIONS[countdownIdx]; }

  function cycleCountdown() {
    countdownIdx = (countdownIdx + 1) % COUNTDOWN_OPTIONS.length;
    document.getElementById('countdown-val').textContent = getCountdownSecs() + 's';
  }

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (typeof Hanger !== 'undefined') Hanger.sync();
  }

  // Live counter: 0.1 s (floored) under a minute, then m:ss with no decimals
  function fmt(seconds) {
    if (seconds >= 60) {
      const t = Math.floor(seconds);
      return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
    }
    return (Math.floor(seconds * 10) / 10).toFixed(1);
  }

  function fmtResult(seconds) {
    if (seconds >= 60) {
      const m = Math.floor(seconds / 60);
      let s = Math.round(seconds - m * 60);
      if (s === 60) return (m + 1) + 'm 0s';
      return m + 'm ' + s + 's';
    }
    return Math.round(seconds) + ' s';
  }

  function fmtDate(d) {
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    let h = d.getHours();
    const ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12; if (h === 0) h = 12;
    const mins = d.getMinutes().toString().padStart(2, '0');
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + h + ':' + mins + ampm;
  }

  function createFavicon() {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const ctx = c.getContext('2d');

    // Square background
    ctx.fillStyle = '#111111';
    ctx.fillRect(0, 0, 180, 180);

    // H shape scaled to 180×180
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(28, 17, 28, 146);   // left bar
    ctx.fillRect(124, 17, 28, 146);  // right bar
    ctx.fillRect(28, 73, 124, 25);   // crossbar

    // Apple touch icon for iOS home screen
    let apple = document.querySelector("link[rel='apple-touch-icon']") || document.createElement('link');
    apple.rel = 'apple-touch-icon';
    apple.href = c.toDataURL('image/png');
    if (!apple.parentNode) document.head.appendChild(apple);
  }

  const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function startCountdown() {
    unlockAudio(); // must run inside the tap for iOS
    document.getElementById('count-box').innerHTML = '';
    show('screen-countdown');
    const total = getCountdownSecs();
    const t0 = performance.now();
    scheduleCountdownBeeps(total, t0);
    let shown = total;
    updateCountdownUI(total);

    // Each tick is timed from t0, not from the previous tick, so it never drifts
    function next() {
      const remaining = total - Math.floor((performance.now() - t0) / 1000 + 0.005);
      if (remaining <= 0) { countTimer = null; beginHang(t0 + total * 1000); return; }   // zero = the go beep
      if (remaining !== shown) { shown = remaining; updateCountdownUI(remaining); }
      const nextAt = t0 + (total - remaining + 1) * 1000;
      countTimer = setTimeout(next, Math.max(0, nextAt - performance.now()));
    }
    countTimer = setTimeout(next, 1000);
  }

  function cancelCountdown() {
    clearTimeout(countTimer);
    countTimer = null;
    cancelCountdownBeeps();
    show('screen-ready');
  }

  function updateCountdownUI(n) {
    const box = document.getElementById('count-box');
    const animate = !reduceMotion();

    // Current number fades out
    box.querySelectorAll('.count-num:not(.out)').forEach(old => {
      if (!animate) { old.remove(); return; }
      old.classList.remove('in');
      old.classList.add('out');
      setTimeout(() => old.remove(), 400);
    });

    // New number fades in
    const el = document.createElement('div');
    el.className = 'count-num' + (animate ? ' in' : '');
    el.textContent = n;
    box.appendChild(el);

  }

  // startAt: the exact moment the go beep sounds, so the timer's zero matches it
  function beginHang(startAt) {
    show('screen-hang');
    startTs = startAt || performance.now();
    msNext = MS_EVERY;
    function tick() {
      const secs = (performance.now() - startTs) / 1000;
      document.getElementById('hang-display').textContent = fmt(secs);
      if (secs >= msNext) { playMilestone(); msNext += MS_EVERY; }
      hangRAF = requestAnimationFrame(tick);
    }
    hangRAF = requestAnimationFrame(tick);
  }

  function cancelHang() {
    cancelAnimationFrame(hangRAF);
    hangRAF = null;
    stopMilestone();
    document.getElementById('hang-display').textContent = '00.0';
    show('screen-ready');
  }

  function stopTimer() {
    const stopTs = performance.now();
    rawMs = stopTs - startTs;
    cancelAnimationFrame(hangRAF);
    hangRAF = null;
    stopMilestone();

    const rawSec = rawMs / 1000;
    document.getElementById('t-raw').textContent   = fmtResult(rawSec);
    show('screen-result');
    document.getElementById('reaction-input').value = 5;
    updateAdjusted();
    resetHandToggles();

    setTimeout(() => {
      const inp = document.getElementById('reaction-input');
      inp.focus();
      inp.select();
    }, 300);
  }

  /* ─── MILESTONES ─────────────────────────────────────
     Every 30 s an animation fills the STOP zone (no number shown). Four scenes rotate:
     confetti, fireworks, barbell lift, pull-up. Drawn on a canvas that
     ignores taps, so STOP always works. */
  const MS_EVERY = 30;
  const ACCENT   = '#74B3CE';
  const FONT     = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif";
  let msNext = MS_EVERY;
  let msIdx  = 0;
  let msRAF  = null;

  const clamp01   = v => Math.max(0, Math.min(1, v));
  const rand      = (a, b) => a + Math.random() * (b - a);
  const easeOut3  = t => 1 - Math.pow(1 - t, 3);
  const easeInOut3 = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

  function playMilestone() {
    stopMilestone();
    const disp = document.getElementById('hang-display');
    disp.classList.remove('flash');
    void disp.offsetWidth;
    disp.classList.add('flash');
    if (reduceMotion()) return;

    const btn = document.getElementById('btn-stop');
    const cv  = document.getElementById('ms-canvas');
    const w = btn.clientWidth, h = btn.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width  = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const scene = MS_SCENES[msIdx % MS_SCENES.length](w, h);
    msIdx++;
    btn.classList.add('celebrating');

    const t0 = performance.now();
    let last = 0;
    function frame(now) {
      const t  = (now - t0) / 1000;
      const dt = Math.min(0.05, Math.max(0, t - last));
      last = t;
      ctx.clearRect(0, 0, w, h);
      const fade = clamp01(t / 0.2) * clamp01((scene.dur - t) / 0.55);
      ctx.save();
      ctx.globalAlpha = fade;
      scene.draw(ctx, t, dt);
      ctx.restore();
      if (t < scene.dur) msRAF = requestAnimationFrame(frame);
      else stopMilestone();
    }
    msRAF = requestAnimationFrame(frame);
  }

  function stopMilestone() {
    if (msRAF) cancelAnimationFrame(msRAF);
    msRAF = null;
    const cv = document.getElementById('ms-canvas');
    cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
    document.getElementById('btn-stop').classList.remove('celebrating');
  }

  /* Scene 1 — confetti: two cannons fire squares and strips up from the bottom corners */
  function sceneConfetti(w, h) {
    const cols = ['#ffffff', '#ffffff', ACCENT, ACCENT, ACCENT, '#a3a3a3', '#d9d9d9', '#5f5f5f'];
    const g = h * 1.5;
    const parts = [];
    for (let i = 0; i < 190; i++) {
      const left = i % 2 === 0;
      const a = rand(1.0, 1.38);                          // radians above horizontal
      const s = rand(h * 1.25, h * 2.05);
      const size = rand(5, 10);
      parts.push({
        x: left ? -6 : w + 6, y: h * rand(0.82, 0.98),
        vx: (left ? 1 : -1) * Math.cos(a) * s * rand(0.7, 1.15),
        vy: -Math.sin(a) * s,
        delay: rand(0, 0.32),
        sw: size, sh: size * (Math.random() < 0.45 ? 1 : rand(0.3, 0.5)),
        rot: rand(0, Math.PI * 2), spin: rand(-9, 9),
        flip: rand(0, Math.PI * 2), flipV: rand(7, 15),
        sway: rand(0.8, 2.2), swayA: rand(18, 46), phase: rand(0, 6.28),
        col: cols[(Math.random() * cols.length) | 0]
      });
    }
    return {
      dur: 3.6,
      draw(ctx, t, dt) {
        for (const p of parts) {
          if (t < p.delay) continue;
          const drag = Math.exp(-1.6 * dt);
          p.vx *= drag; p.vy = p.vy * drag + g * dt;
          if (p.vy > h * 0.42) p.vy = h * 0.42;            // terminal flutter speed
          p.x += p.vx * dt + Math.sin((t - p.delay) * p.sway * 3 + p.phase) * p.swayA * dt * (p.vy > 0 ? 1 : 0);
          p.y += p.vy * dt;
          p.rot += p.spin * dt; p.flip += p.flipV * dt;
          const fy = Math.cos(p.flip);
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.scale(1, fy);
          ctx.globalAlpha *= fy < 0 ? 0.7 : 1;
          ctx.fillStyle = p.col;
          ctx.fillRect(-p.sw / 2, -p.sh / 2, p.sw, p.sh);
          ctx.restore();
        }
      }
    };
  }

  /* Scene 2 — fireworks: three shells rise, burst into trailing rings, then glitter out */
  function sceneFireworks(w, h) {
    const R = Math.min(w, h);
    const shells = [
      { at: 0.00, x: w * 0.50 + rand(-10, 10), ty: h * 0.34, cols: ['#ffffff', ACCENT] },
      { at: 0.32, x: w * 0.22 + rand(-10, 10), ty: h * 0.52, cols: [ACCENT] },
      { at: 0.62, x: w * 0.78 + rand(-10, 10), ty: h * 0.46, cols: ['#ffffff', '#bdbdbd'] },
      { at: 0.95, x: w * 0.36 + rand(-10, 10), ty: h * 0.24, cols: [ACCENT, '#ffffff'] },
      { at: 1.25, x: w * 0.64 + rand(-10, 10), ty: h * 0.68, cols: ['#ffffff', ACCENT] }
    ];
    const RISE = 0.55;
    const sparks = [];
    const flashes = [];
    shells.forEach(s => s.done = false);

    function burst(s, t) {
      const n = 64;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + rand(-0.04, 0.04);
        const sp = R * rand(0.62, 0.78);
        sparks.push({ x: s.x, y: s.ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, born: t,
          life: rand(1.3, 1.8), col: s.cols[i % s.cols.length], trail: [], seed: rand(0, 9), w: 2.8 });
      }
      for (let i = 0; i < 26; i++) {
        const a = (i / 26) * Math.PI * 2;
        const sp = R * 0.3;
        sparks.push({ x: s.x, y: s.ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, born: t,
          life: rand(1.0, 1.3), col: ACCENT, trail: [], seed: rand(0, 9), w: 1.6 });
      }
      flashes.push({ x: s.x, y: s.ty, born: t });
    }

    return {
      dur: 3.8,
      draw(ctx, t, dt) {
        // rising shells
        for (const s of shells) {
          const lt = t - s.at;
          if (lt < 0 || s.done) continue;
          if (lt >= RISE) { s.done = true; burst(s, t); continue; }
          const p = easeOut3(lt / RISE);
          const y = h + 10 + (s.ty - h - 10) * p;
          const tail = 34 * (1 - p) + 8;
          const grad = ctx.createLinearGradient(s.x, y, s.x, y + tail);
          grad.addColorStop(0, 'rgba(255,255,255,0.95)');
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.strokeStyle = grad;
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(s.x, y); ctx.lineTo(s.x, y + tail); ctx.stroke();
        }
        // burst flashes
        for (const f of flashes) {
          const a = 1 - (t - f.born) / 0.3;
          if (a <= 0) continue;
          const r = R * 0.22 * (1.2 - a * 0.4);
          const rg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
          rg.addColorStop(0, `rgba(255,255,255,${0.45 * a})`);
          rg.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = rg;
          ctx.fillRect(f.x - r, f.y - r, r * 2, r * 2);
        }
        // sparks with tapered trails
        const base = ctx.globalAlpha;
        for (const p of sparks) {
          const age = t - p.born;
          if (age > p.life) continue;
          const drag = Math.exp(-2.4 * dt);
          p.vx *= drag; p.vy = p.vy * drag + h * 0.28 * dt;
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.trail.push(p.x, p.y);
          if (p.trail.length > 14) p.trail.splice(0, 2);
          let a = 1 - Math.pow(age / p.life, 1.6);
          if (age / p.life > 0.55) a *= 0.55 + 0.45 * Math.sin(age * 38 + p.seed);   // glitter
          ctx.strokeStyle = p.col;
          ctx.lineCap = 'round';
          const tr = p.trail, n = tr.length / 2;
          for (let k = 1; k < n; k++) {
            ctx.globalAlpha = base * Math.max(0, a) * (k / n);
            ctx.lineWidth = p.w * (k / n);
            ctx.beginPath();
            ctx.moveTo(tr[(k - 1) * 2], tr[(k - 1) * 2 + 1]);
            ctx.lineTo(tr[k * 2], tr[k * 2 + 1]);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = base;
      }
    };
  }

  /* Scene 3 — barbell: plates slide on, the bar is driven overhead, flexes and settles */
  function sceneBarbell(w, h) {
    const cx = w / 2;
    const L  = Math.min(w * 0.82, 340);
    const H  = Math.min(h * 0.32, 130, w * 0.36);
    const floorY = h * 0.74;
    const restY  = floorY - H / 2;
    const topY   = h * 0.38;
    const plates = [
      { hh: H,        pw: Math.max(10, H * 0.13), col: ACCENT },
      { hh: H * 0.8,  pw: Math.max(8,  H * 0.11), col: '#ffffff' },
      { hh: H * 0.58, pw: Math.max(7,  H * 0.09), col: '#a8a8a8' }
    ];
    const sleeve = L / 2 - plates[0].pw * 3.6;
    const dust = [];
    let dustDone = false;

    function liftY(t) {
      if (t < 1.0) return restY;
      if (t < 1.65) return restY + (topY - restY) * easeOutBack(clamp01((t - 1.0) / 0.65));
      return topY;
    }
    function sag(t) {
      if (t < 1.0) return 0;
      if (t < 1.25) return H * 0.16 * Math.sin(((t - 1.0) / 0.25) * Math.PI / 2);   // ends lag behind as it drives up
      const k = t - 1.25;
      return H * 0.16 * Math.exp(-4.2 * k) * Math.cos(k * 17);                     // whip and settle
    }

    return {
      dur: 3.5,
      draw(ctx, t, dt) {
        const y = liftY(t), s = sag(t);
        // floor
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillRect(cx - L * 0.62, floorY, L * 1.24, 2);

        // speed lines while driving up
        if (t > 1.0 && t < 1.7) {
          const a = 1 - Math.abs((t - 1.3) / 0.35);
          ctx.fillStyle = `rgba(116,179,206,${0.7 * Math.max(0, a)})`;
          for (const side of [-1, 1]) {
            for (let i = 0; i < 3; i++) {
              const x = cx + side * (sleeve + plates[0].pw * (0.5 + i * 1.2));
              ctx.fillRect(x - 1, y + s + H * 0.6, 2, H * (0.5 - i * 0.12));
            }
          }
        }

        // dust kicked up when it leaves the floor
        if (!dustDone && t >= 1.0) {
          dustDone = true;
          for (let i = 0; i < 26; i++) {
            const side = i % 2 ? 1 : -1;
            dust.push({ x: cx + side * (sleeve + rand(0, plates[0].pw * 3)), y: floorY,
              vx: side * rand(20, 90), vy: -rand(20, 90), life: rand(0.5, 0.9), born: t, r: rand(1.5, 3) });
          }
        }
        const base = ctx.globalAlpha;
        for (const d of dust) {
          const age = t - d.born;
          if (age > d.life) continue;
          d.vy += 160 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
          ctx.globalAlpha = base * (1 - age / d.life) * 0.7;
          ctx.fillStyle = '#d4d4d4';
          ctx.fillRect(d.x, d.y, d.r, d.r);
        }
        ctx.globalAlpha = base;

        // bar: a gentle curve whose ends sag by s
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.lineCap = 'butt';
        ctx.beginPath();
        ctx.moveTo(cx - L / 2, y + s);
        ctx.quadraticCurveTo(cx, y - s, cx + L / 2, y + s);
        ctx.stroke();
        // knurl marks / grip
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(cx - L * 0.16, y - 4, 2, 8);
        ctx.fillRect(cx + L * 0.16 - 2, y - 4, 2, 8);

        // plates slide on from the sides
        for (const side of [-1, 1]) {
          plates.forEach((p, i) => {
            const st = clamp01((t - 0.05 - i * 0.14) / 0.42);
            if (st <= 0) return;
            const off = sleeve + plates.slice(0, i).reduce((acc, q) => acc + q.pw + 2, 0) + p.pw / 2;
            const fromX = side * (w / 2 + 40);
            const px = cx + fromX + (side * off - fromX) * easeOutBack(st);
            const along = Math.abs(px - cx) / (L / 2);
            const py = y + s * along * along;   // follow the curve
            ctx.fillStyle = p.col;
            ctx.fillRect(px - p.pw / 2, py - p.hh / 2, p.pw, p.hh);
          });
          // collar
          const cxl = cx + side * (sleeve - 5);
          ctx.fillStyle = '#ffffff';
          const ca = (sleeve - 5) / (L / 2);
          ctx.fillRect(cxl - 3, y + s * ca * ca - 7, 6, 14);
        }

        // lockout pulse at the top
        if (t > 1.55 && t < 2.4) {
          const k = (t - 1.55) / 0.85;
          ctx.strokeStyle = `rgba(116,179,206,${(1 - k) * 0.9})`;
          ctx.lineWidth = 2;
          const rw = L * (0.55 + k * 0.5), rh = H * (0.9 + k * 0.9);
          ctx.strokeRect(cx - rw / 2, y - rh / 2, rw, rh);
        }
      }
    };
  }

  /* Scene 4 — pull-up: a figure pulls chin over the bar twice; arms solved with simple IK */
  function scenePullup(w, h) {
    const s  = Math.min(w / 250, h / 260, 1.9);
    const cx = w / 2;
    const barY = h / 2 - 68 * s;                         // figure's full travel is centred
    const L1 = 30 * s, L2 = 30 * s;
    const handX = 38 * s, shX = 21 * s;
    const dx = handX - shX;
    const hangSY = barY + Math.sqrt(Math.pow((L1 + L2) * 0.97, 2) - dx * dx);
    const topSY  = barY + 6 * s;
    const pops = [];

    // 0 = dead hang, 1 = chin over bar
    function pos(t) {
      const seg = [
        [0.00, 0.35, 0, 0], [0.35, 0.85, 0, 1], [0.85, 1.10, 1, 1],
        [1.10, 1.60, 1, 0], [1.60, 1.80, 0, 0], [1.80, 2.30, 0, 1], [2.30, 9, 1, 1]
      ];
      for (const [a, b, p0, p1] of seg) {
        if (t >= a && t < b) return p0 + (p1 - p0) * easeInOut3((t - a) / (b - a));
      }
      return 1;
    }
    function elbow(hx, hy, sx, sy, out) {
      const ddx = sx - hx, ddy = sy - hy;
      const d = Math.min(Math.hypot(ddx, ddy), L1 + L2 - 0.01);
      const a = d / 2, k = Math.sqrt(Math.max(0, L1 * L1 - a * a));
      const mx = (hx + sx) / 2, my = (hy + sy) / 2;
      let nx = -ddy / d, ny = ddx / d;
      if (nx * out < 0) { nx = -nx; ny = -ny; }
      return [mx + nx * k, my + ny * k];
    }
    const fired = [false, false];

    return {
      dur: 3.4,
      draw(ctx, t, dt) {
        const p = pos(t);
        const sy = hangSY + (topSY - hangSY) * p;
        const vel = (pos(t + 0.02) - p) / 0.02;
        const swing = Math.sin(t * 5.2) * 0.05 * (1 - p);

        // bar
        ctx.fillStyle = ACCENT;
        ctx.fillRect(cx - 110 * s, barY - 3 * s, 220 * s, 6 * s);
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(cx - 116 * s, barY - 30 * s, 4 * s, 34 * s);
        ctx.fillRect(cx + 112 * s, barY - 30 * s, 4 * s, 34 * s);

        ctx.strokeStyle = '#ffffff';
        ctx.fillStyle = '#ffffff';
        ctx.lineWidth = 7 * s;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // arms
        for (const side of [-1, 1]) {
          const hx = cx + side * handX, hy = barY;
          const sx = cx + side * shX;
          const [ex, ey] = elbow(hx, hy, sx, sy, side);
          ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ex, ey); ctx.lineTo(sx, sy); ctx.stroke();
        }
        // shoulders + torso
        const hipY = sy + 50 * s;
        ctx.beginPath();
        ctx.moveTo(cx - shX, sy); ctx.lineTo(cx + shX, sy);
        ctx.moveTo(cx, sy); ctx.lineTo(cx, hipY);
        ctx.stroke();
        // legs, slightly bent and swinging
        ctx.save();
        ctx.translate(cx, hipY);
        ctx.rotate(swing);
        ctx.beginPath();
        ctx.moveTo(-8 * s, 0); ctx.lineTo(-10 * s, 30 * s); ctx.lineTo(-6 * s, 58 * s);
        ctx.moveTo(8 * s, 0);  ctx.lineTo(10 * s, 30 * s);  ctx.lineTo(6 * s, 58 * s);
        ctx.moveTo(-8 * s, 0); ctx.lineTo(8 * s, 0);
        ctx.stroke();
        ctx.restore();
        // head
        ctx.beginPath();
        ctx.arc(cx, sy - 21 * s, 11 * s, 0, Math.PI * 2);
        ctx.fill();

        // motion streaks under the feet while pulling up
        if (vel > 0.4) {
          const a = Math.min(1, vel / 3);
          ctx.fillStyle = `rgba(116,179,206,${0.6 * a})`;
          for (let i = -1; i <= 1; i++) {
            ctx.fillRect(cx + i * 9 * s - 1, hipY + 66 * s, 2 * s, 26 * s * a);
          }
        }

        // a pop of squares each time the chin clears the bar
        [0.85, 2.30].forEach((at, i) => {
          if (!fired[i] && t >= at) {
            fired[i] = true;
            for (let j = 0; j < 18; j++) {
              const a = rand(-Math.PI, 0);
              const sp = rand(60, 150) * s;
              pops.push({ x: cx, y: barY - 34 * s, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                born: t, life: rand(0.5, 0.8), sz: rand(3, 6) * s, col: j % 3 ? ACCENT : '#ffffff' });
            }
          }
        });
        const base = ctx.globalAlpha;
        for (const q of pops) {
          const age = t - q.born;
          if (age > q.life) continue;
          q.vy += 220 * s * dt; q.x += q.vx * dt; q.y += q.vy * dt;
          ctx.globalAlpha = base * (1 - age / q.life);
          ctx.fillStyle = q.col;
          ctx.fillRect(q.x - q.sz / 2, q.y - q.sz / 2, q.sz, q.sz);
        }
        ctx.globalAlpha = base;
      }
    };
  }

  function stepReaction(delta) {
    const input = document.getElementById('reaction-input');
    let v = parseFloat(input.value);
    if (isNaN(v)) v = 0;
    v = Math.max(0, Math.round((v + delta) * 100) / 100);
    input.value = v;
    updateAdjusted();
  }

  function updateAdjusted() {
    positionReactionUnit();
    const raw  = rawMs / 1000;
    const rStr = document.getElementById('reaction-input').value.trim();
    const r    = parseFloat(rStr);
    if (isNaN(r) || rStr === '') {
      document.getElementById('t-react').textContent = '—';
      document.getElementById('t-adj').textContent   = fmtResult(raw);
      return;
    }
    document.getElementById('t-react').textContent = fmtResult(r);
    document.getElementById('t-adj').textContent   = fmtResult(Math.max(0, raw - r));
  }

  function positionReactionUnit() {
    const input   = document.getElementById('reaction-input');
    const unit    = document.getElementById('reaction-unit');
    const measure = document.getElementById('reaction-measure');
    measure.textContent = input.value !== '' ? input.value : input.placeholder;
    const halfTextWidth = measure.offsetWidth / 2;
    const gap = 5;
    unit.style.transform = `translate(${halfTextWidth + gap}px, -50%)`;
  }

  function resetHandToggles() {

    updateHandToggleUI();

  function toggleHand(hand) {
    handState[hand] = !handState[hand];
    updateHandToggleUI();
  }

  function updateHandToggleUI() {
    document.getElementById('toggle-left').classList.toggle('active', handState.left);
    document.getElementById('toggle-right').classList.toggle('active', handState.right);

  function saveAndReset() {

    history.unshift({
      raw, reaction: r, adjusted: Math.max(0, raw - r), date: new Date(),
      left: handState.left, right: handState.right

  const REVEAL_W = 76;
  let openSwipe = null;

  function openSwipeItem(swipe) {
    const item = swipe.querySelector('.history-item');
    item.style.transition = 'transform 0.2s ease';
    item.style.transform = `translateX(-${REVEAL_W}px)`;
    swipe.dataset.open = '1';
    openSwipe = swipe;
  }

  function closeSwipeItem(swipe) {
    if (!swipe) return;
    const item = swipe.querySelector('.history-item');
    if (item) {
      item.style.transition = 'transform 0.2s ease';
      item.style.transform = 'translateX(0)';
    }
    swipe.dataset.open = '0';
    if (openSwipe === swipe) openSwipe = null;
  }

  function setupSwipeToDelete(containerId) {
    const container = document.getElementById(containerId);
    let dragEl = null, itemEl = null, startX = 0, dx = 0, wasOpen = false, moved = false, pointerId = null;

    container.addEventListener('pointerdown', e => {
      if (e.target.closest('.delete-icon-btn')) return;
      const swipe = e.target.closest('.history-swipe');
      if (!swipe) return;
      dragEl = swipe;
      itemEl = swipe.querySelector('.history-item');
      startX = e.clientX;
      wasOpen = swipe.dataset.open === '1';
      dx = wasOpen ? -REVEAL_W : 0;
      moved = false;
      pointerId = e.pointerId;
      itemEl.style.transition = 'none';
      dragEl.setPointerCapture(pointerId);

      if (openSwipe && openSwipe !== dragEl) closeSwipeItem(openSwipe);
    });

    container.addEventListener('pointermove', e => {
      if (!dragEl || e.pointerId !== pointerId) return;
      const delta = e.clientX - startX;
      if (Math.abs(delta) > 6) moved = true;
      const base = wasOpen ? -REVEAL_W : 0;
      dx = Math.min(0, Math.max(-REVEAL_W, base + delta));
      itemEl.style.transform = `translateX(${dx}px)`;
    });

    function endDrag(e) {
      if (!dragEl || e.pointerId !== pointerId) return;
      if (!moved) {
        if (wasOpen) closeSwipeItem(dragEl);
      } else if (dx <= -REVEAL_W / 2) {
        openSwipeItem(dragEl);
      } else {
        closeSwipeItem(dragEl);
      }
      dragEl = null; itemEl = null;
    }

    container.addEventListener('pointerup', endDrag);
    container.addEventListener('pointercancel', endDrag);
  }


  /* ─── HANGING FIGURE ─────────────────────────────────
     The home artwork drawn as a WebGL mesh so it can move. Hands and bar stay
     put; the body rotates about the grip like a pendulum, the legs lag behind
     on a second spring, and a soft iridescent sheen slides over the glass
     while she moves. Tap her and she swings; tap just beside her and she
     dodges; tap her three times quickly and she does an effort pull-up: the
     body rises, the arms shorten and bow out at the elbows, and the bar and
     hands (drawn as a separate layer on top) pass in front of her head.
     If WebGL is unavailable the plain <img> stays. */
  const Hanger = (() => {
    // Landmarks in design-space pixels (426 × 640); the artwork itself is 852 × 1280 WebP
    const PIVOT_X = 182, PIVOT_Y = 52;     // between the two hands on the bar
    const ARM_TOP = 74,  ARM_BOT = 150;    // wrists stay fixed, forearms bend in
    const HIP = 330,     FEET = 560;       // legs swing extra from here down
    const SHADOW = 588;                    // floor shadow below this stays still
    const SHO = 186;                       // shoulders: arms run ARM_TOP → SHO
    const HEAD_X = 186;                    // head is centred here, rows 121–180
    // Head + hair move rigidly; the arms beside them fold. Asymmetric: on screen-left the band
    // reaches out to carry her ponytail; on screen-right it stops at the jaw, because her
    // arm starts only ~2px further out and must fold as one piece.
    const HEAD_IN_L = 30, HEAD_OUT_L = 37;
    const HEAD_IN_R = 22, HEAD_OUT_R = 26;
    const RISE = 26;                       // an attempted pull-up: she only gets part way (62/80 distorted the arms)
    const BOW = 3;                         // a hint of elbow bend at the top of the attempt
    const ARM_LX = 136, ARM_RX = 230;      // arm centrelines; folded arms narrow toward these
    const THIN = 0;                        // no narrowing at this height: arms keep their own shape
    const COLS = 64;                       // fine columns so the head band edge is crisp
    const TAPS_FOR_PULL = 3, TAP_WINDOW = 1.3;
    const SH_X = 190, SH_Y = 604, SH_RX = 52, SH_RY = 8;   // soft floor shadow under her feet
    const SH_ALPHA = 0.14;
    const FOOT_Y = 556;

    const K1 = 30, C1 = 1.5;               // body pendulum: ~0.9 Hz, slow settle
    const K2 = 95, C2 = 3.5;               // legs, relative to the body

    let img, cv, gl, uni = {}, W = 426, H = 640;
    let alpha = null, rowL = [], rowR = [];
    let th1 = 0, w1 = 0, th2 = 0, w2 = 0, sheenPhase = 0.2;
    let raf = null, lastT = 0, live = false;
    let pullStart = -1, pull = 0, prevPull = 0, shake = 0, released = false, taps = [], nowT = 0;
    let bodyCount = 0, barCount = 0;

    const sm = (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
    const angleAt = (y, a1, a2) => (y > SHADOW ? 0 : sm(ARM_TOP, ARM_BOT, y)) * (a1 + sm(HIP, FEET, y) * a2);

    const VS = `
      attribute vec3 aPos;                 // x, y, layer (1 = body, 0 = bar and hands)
      uniform vec2 uSize, uPivot;
      uniform float uA1, uA2, uPull, uShake, uShX, uShScale;
      varying vec2 vUv;
      varying vec2 vLocal;
      void main() {
        vLocal = vec2(0.0);
        if (aPos.z > 1.5) {                 // floor shadow quad: follows the feet, no warp
          vec2 o = aPos.xy - vec2(${SH_X}.0, ${SH_Y}.0);
          vLocal = o / vec2(${SH_RX}.0, ${SH_RY}.0);
          vec2 q = vec2(${SH_X}.0 + uShX, ${SH_Y}.0) + o * uShScale;
          vUv = vec2(0.0);
          vec2 clip = q / uSize * 2.0 - 1.0;
          gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
          return;
        }
        float y = aPos.y;
        float body = aPos.z * step(y, ${SHADOW}.0);
        float side = aPos.x - ${HEAD_X}.0;
        float mid  = side < 0.0
          ? 1.0 - smoothstep(${HEAD_IN_L}.0, ${HEAD_OUT_L}.0, -side)
          : 1.0 - smoothstep(${HEAD_IN_R}.0, ${HEAD_OUT_R}.0, side);
        float tArm = clamp((y - ${ARM_TOP}.0) / (${SHO}.0 - ${ARM_TOP}.0), 0.0, 1.0);
        float lift = mix(tArm, 1.0, mid);  // arms compress, head and body move as one
        float fold = max(uPull, 0.0) * sin(3.14159 * tArm) * (1.0 - mid);
        float armC = side < 0.0 ? ${ARM_LX}.0 : ${ARM_RX}.0;
        vec2 d = vec2(sign(side) * ${BOW}.0 * fold
                      + (armC - aPos.x) * ${THIN.toFixed(3)} * fold
                      + uShake * lift,
                      -${RISE}.0 * uPull * lift) * body;
        float w = smoothstep(${ARM_TOP}.0, ${ARM_BOT}.0, y) * step(y, ${SHADOW}.0);
        float ang = w * (uA1 + smoothstep(${HIP}.0, ${FEET}.0, y) * uA2);
        vec2 p = aPos.xy + d - uPivot;
        float c = cos(ang), s = sin(ang);
        vec2 q = vec2(c * p.x - s * p.y, s * p.x + c * p.y) + uPivot;
        vUv = aPos.xy / uSize;
        vec2 clip = q / uSize * 2.0 - 1.0;
        gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
      }`;
    const FS = `
      precision mediump float;
      uniform sampler2D uTex;
      uniform float uSheen, uPhase, uMode, uShA;
      varying vec2 vUv;
      varying vec2 vLocal;
      void main() {
        if (uMode > 0.5) {
          float a = pow(1.0 - smoothstep(0.0, 1.0, length(vLocal)), 1.6) * uShA;
          gl_FragColor = vec4(vec3(0.16, 0.2, 0.3) * a, a);
          return;
        }
        vec4 c = texture2D(uTex, vUv);
        float d = vUv.x * 0.55 + vUv.y * 0.85 - uPhase;
        float band = exp(-d * d * 55.0);
        vec3 iri = 0.5 + 0.5 * cos(6.2831 * (vec3(0.0, 0.33, 0.67) + d * 2.5 + uPhase));
        vec3 tint = mix(vec3(1.0), iri, 0.4);
        c.rgb = min(c.rgb + tint * band * uSheen * c.a, vec3(c.a));
        gl_FragColor = c;
      }`;

    function compile(type, src) {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
      return sh;
    }

    function setupGL() {
      gl = cv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: true });
      if (!gl) return false;
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
      gl.useProgram(prog);

      // Two grids: the body (wrists down) and, drawn after it, the static bar and hands,
      // so her head passes behind the bar when she pulls up
      const verts = [], idx = [];
      function grid(rows, layer) {
        const base = verts.length / 3;
        rows.forEach(y => { for (let c = 0; c <= COLS; c++) verts.push((c / COLS) * W, y, layer); });
        const start = idx.length;
        for (let r = 0; r < rows.length - 1; r++)
          for (let c = 0; c < COLS; c++) {
            const a = base + r * (COLS + 1) + c, b = a + COLS + 1;
            idx.push(a, b, a + 1, a + 1, b, b + 1);
          }
        return idx.length - start;
      }
      const bodyRows = new Set([ARM_TOP, SHO, SHADOW, H]);
      for (let y = ARM_TOP; y < H; y += 8) bodyRows.add(y);
      bodyCount = grid([...bodyRows].sort((a, b) => a - b), 1);
      barCount  = grid([0, ARM_TOP / 2, ARM_TOP], 0);
      const sb = verts.length / 3;
      verts.push(SH_X - SH_RX, SH_Y - SH_RY, 2,  SH_X + SH_RX, SH_Y - SH_RY, 2,
                 SH_X - SH_RX, SH_Y + SH_RY, 2,  SH_X + SH_RX, SH_Y + SH_RY, 2);
      idx.push(sb, sb + 2, sb + 1, sb + 1, sb + 2, sb + 3);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'aPos');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);

      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      ['uSize', 'uPivot', 'uA1', 'uA2', 'uSheen', 'uPhase', 'uPull', 'uShake', 'uShX', 'uShScale', 'uMode', 'uShA'].forEach(n => uni[n] = gl.getUniformLocation(prog, n));
      gl.uniform2f(uni.uSize, W, H);
      gl.uniform2f(uni.uPivot, PIVOT_X, PIVOT_Y);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.clearColor(0, 0, 0, 0);
      return true;
    }

    // Alpha map for hit-testing, plus the body's left/right edge on every row
    function readAlpha() {
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0, W, H);
      try { alpha = x.getImageData(0, 0, W, H).data; } catch (e) { alpha = null; return; }
      for (let y = 0; y < H; y++) {
        let l = -1, r = -1;
        for (let xx = 0; xx < W; xx++) if (alpha[(y * W + xx) * 4 + 3] > 40) { if (l < 0) l = xx; r = xx; }
        rowL[y] = l; rowR[y] = r;
      }
    }

    function resize() {
      const r = cv.getBoundingClientRect();
      if (!r.width) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      gl.viewport(0, 0, cv.width, cv.height);
    }

    function step(dt) {
      // Springs stiffen as the angle grows, so repeated taps can't fling her too far
      const a1 = -K1 * th1 * (1 + 40 * th1 * th1) - C1 * w1;
      w1 += a1 * dt; th1 += w1 * dt;
      const a2 = -K2 * th2 * (1 + 60 * th2 * th2) - C2 * w2 - 0.9 * a1;   // legs lag the body
      w2 += a2 * dt; th2 += w2 * dt;
      th1 = Math.max(-0.26, Math.min(0.26, th1));
      th2 = Math.max(-0.22, Math.min(0.22, th2));
    }

    // Attempted pull-up, 0 = dead hang, 1 = as high as she gets. A slow, straining rise that
    // stalls, a shaky hold where she sinks a little, then she gives up and drops back with a
    // small stretch into the dead hang.
    function pullCurve(t) {
      if (t < 0.85) return 1 - Math.pow(1 - t / 0.85, 2.2);              // strains up, slowing
      if (t < 1.55) return 1 - 0.18 * easeInOut3((t - 0.85) / 0.7);      // can't hold it, sinks
      if (t < 1.85) return 0.82 * (1 - Math.pow((t - 1.55) / 0.3, 2));   // lets go
      const k = t - 1.85;
      return -0.12 * Math.exp(-5 * k) * Math.sin(k * 13);                 // stretch and settle
    }
    const PULL_END = 2.7;

    function startPull() {
      pullStart = nowT || performance.now() / 1000; released = false; taps = [];
      w1 *= 0.3; w2 = w2 * 0.3 + 0.35;                 // settle the swing; knees draw up a touch
    }

    function updatePull(dt) {
      prevPull = pull;
      if (pullStart < 0) { pull = 0; shake = 0; return; }
      const t = nowT - pullStart;
      if (t >= PULL_END) { pullStart = -1; pull = 0; shake = 0; return; }
      pull = pullCurve(t);
      // effort tremble while holding at the top
      shake = (t > 0.6 && t < 1.6) ? Math.sin(t * 95) * 0.8 * Math.sin(Math.PI * (t - 0.6) / 1.0) : 0;
      if (!released && t >= 1.85) {                    // drop back into a small swing
        released = true;
        w1 += (Math.random() < 0.5 ? -1 : 1) * 0.28;
        w2 += 0.5;
      }
    }

    function frame(now) {
      const t = now / 1000;
      nowT = t;
      let dt = Math.min(0.05, t - (lastT || t));
      lastT = t;
      const frameDt = dt;
      while (dt > 0) { const h = Math.min(dt, 1 / 120); step(h); dt -= h; }
      updatePull(frameDt);

      const still = reduceMotion();
      const idle = still ? 0 : 0.012 * Math.sin(t * 1.1) + 0.006 * Math.sin(t * 0.53 + 1);
      const pullSpeed = frameDt > 0 ? Math.abs(pull - prevPull) / frameDt : 0;
      const motion = Math.min(1, Math.abs(w1) * 1.3 + Math.abs(w2) * 0.4 + pullSpeed * 0.35);
      sheenPhase += w1 * 0.006 + motion * 0.004;

      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(uni.uA1, th1 + idle);
      gl.uniform1f(uni.uA2, th2);
      gl.uniform1f(uni.uPull, pull);
      gl.uniform1f(uni.uShake, shake);
      gl.uniform1f(uni.uSheen, motion * 0.10);   // gentle: the artwork is already bright
      gl.uniform1f(uni.uPhase, 0.35 + Math.sin(sheenPhase) * 0.45);
      // Shadow slides with her feet and shrinks/fades as she rises
      const footAng = angleAt(FOOT_Y, th1 + idle, th2);
      const lift = Math.max(0, pull);
      gl.uniform1f(uni.uShX, -(FOOT_Y - PIVOT_Y) * Math.sin(footAng) * 0.85);
      gl.uniform1f(uni.uShScale, 1 - 0.3 * lift);
      gl.uniform1f(uni.uShA, SH_ALPHA * (1 - 0.45 * lift));
      gl.uniform1f(uni.uMode, 1);
      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, (bodyCount + barCount) * 2);
      gl.uniform1f(uni.uMode, 0);
      gl.drawElements(gl.TRIANGLES, bodyCount, gl.UNSIGNED_SHORT, 0);
      gl.drawElements(gl.TRIANGLES, barCount, gl.UNSIGNED_SHORT, bodyCount * 2);
      raf = requestAnimationFrame(frame);
    }

    function poke(e) {
      const r = cv.getBoundingClientRect();
      let x = (e.clientX - r.left) / r.width * W;
      let y = (e.clientY - r.top) / r.height * H;
      // Undo her current pose so the tap is tested against where she actually is
      const ang = -angleAt(y, th1, th2);
      const px = x - PIVOT_X, py = y - PIVOT_Y;
      x = Math.cos(ang) * px - Math.sin(ang) * py + PIVOT_X;
      y = Math.sin(ang) * px + Math.cos(ang) * py + PIVOT_Y;
      if (pull > 0 && y > ARM_TOP) y += RISE * pull;     // where that point sits in the resting artwork
      if (y < ARM_TOP || y > FEET + 10) return;

      const yi = Math.max(0, Math.min(H - 1, Math.round(y)));
      const hasRow = rowL[yi] >= 0;
      const center = hasRow ? (rowL[yi] + rowR[yi]) / 2 : PIVOT_X;
      const push = x < center ? 1 : -1;                // tapped on her left → she goes right
      const lever = Math.max(0.15, Math.min(1, (y - PIVOT_Y) / (FEET - PIVOT_Y)));
      const legs = sm(HIP, FEET, y);

      let hit = false;
      if (alpha) {
        for (let dy = -9; dy <= 9 && !hit; dy += 3)
          for (let dx = -9; dx <= 9 && !hit; dx += 3) {
            const sx = Math.round(x + dx), sy = Math.round(y + dy);
            if (sx >= 0 && sy >= 0 && sx < W && sy < H && alpha[(sy * W + sx) * 4 + 3] > 60) hit = true;
          }
      }
      const near = hasRow && x > rowL[yi] - 45 && x < rowR[yi] + 45;

      if (hit) {                                       // poked: swing away, legs flick
        w1 += -push * (0.25 + 0.6 * lever);
        w2 += -push * 1.4 * legs;
      } else if (near) {                               // missed: she dodges the finger
        w1 += -push * 0.5;
        w2 += push * (0.6 + 0.6 * legs);
      }
      if ((hit || near) && pullStart < 0) {            // three quick taps on or around her → pull-up
        const tNow = performance.now() / 1000;
        taps = taps.filter(tt => tNow - tt < TAP_WINDOW);
        taps.push(tNow);
        if (taps.length >= TAPS_FOR_PULL) startPull();
      }
      w1 = Math.max(-1.3, Math.min(1.3, w1));
    }

    function sync() {
      if (!live) return;
      const on = document.getElementById('screen-ready').classList.contains('active') && !document.hidden;
      if (on && !raf) { resize(); lastT = 0; raf = requestAnimationFrame(frame); }
      if (!on && raf) { cancelAnimationFrame(raf); raf = null; }
    }

    function init() {
      img = document.querySelector('.ready-bg img');
      cv  = document.getElementById('hanger');
      const go = () => {
        // Landmarks are in a fixed 426 × 640 design space, whatever the image's real resolution
        W = 426; H = 640;
        try { if (!setupGL()) return; } catch (e) { return; }
        readAlpha();
        img.parentNode.classList.add('live');
        live = true;
        cv.addEventListener('pointerdown', poke);
        window.addEventListener('resize', () => { if (raf) resize(); });
        document.addEventListener('visibilitychange', sync);
        sync();
      };
      if (img.complete && img.naturalWidth) go(); else img.addEventListener('load', go, { once: true });
    }

    return { init, sync, poke: (x, y) => poke({ clientX: x, clientY: y }), state: () => ({ th1, w1, th2, w2, pull }),
             pullUp: () => { if (live && pullStart < 0) startPull(); } };
  })();

  createFavicon();
  Hanger.init();
  setupSwipeToDelete('history-list');
  setupSwipeToDelete('history-list-ready');
</script>
</body>
</html>
